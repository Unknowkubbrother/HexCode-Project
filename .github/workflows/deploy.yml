name: Deploy
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish-client-docker:
    name: publish-client-docker
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create .env.local file
        run: |
          echo "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}" >> .env.local
          echo "CLERK_SECRET_KEY=${{secrets.CLERK_SECRET_KEY}}" >> .env.local
          echo "NEXT_PUBLIC_CLERK_SIGN_IN_URL=${{vars.NEXT_PUBLIC_CLERK_SIGN_IN_URL}}" >> .env.local
          echo "NEXT_PUBLIC_CLERK_SIGN_UP_URL=${{vars.NEXT_PUBLIC_CLERK_SIGN_UP_URL}}" >> .env.local
          echo "NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL=${{vars.NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL}}" >> .env.local
          echo "NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL=${{vars.NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL}}" >> .env.local
          echo "NEXT_PUBLIC_API_END_POINT=${{vars.NEXT_PUBLIC_API_END_POINT}}" >> .env.local

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: unknowkubbrother/hexcode_client:latest

  publish-server-docker:
    name: publish-server-docker
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create .env file
        run: |
          echo "MONGODB_URL=${{vars.MONGODB_URL}}" >> .env
          echo "SERVER_PORT=${{vars.SERVER_PORT}}" >> .env
          echo "DOMAIN=${{vars.DOMAIN}}" >> .env
          echo "CLERK_PUBLISHABLE_KEY=${{secrets.CLERK_PUBLISHABLE_KEY}}" >> .env
          echo "CLERK_SECRET_KEY=${{secrets.CLERK_SECRET_KEY}}" >> .env
          echo "NODE_ENV=production" >> .env

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: unknowkubbrother/hexcode_server:latest
  
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: webfactory/ssh-agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DO_SSH_PRIVATE_KEY }}

      - name: Deploy to DigitalOcean Droplet
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ secrets.DROPLET_IP }}
          "/root/HexCode-Deploy/deploy.sh"