version: '3.8'

services:
  mongo_db:
    container_name: database
    image: mongo:latest
    ports:
      - 27017:27017
    restart: always
    volumes:
      - mongo_db:/data/db

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    env_file:
      - ./client/.env.local
    container_name: hexcode_client
    image: hexcode_client_image
    ports:
      - 3000:3000
    restart: always
    depends_on:
      - server

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    env_file:
      - ./server/.env
    container_name: hexcode_server
    image: hexcode_server_image
    ports:
      - 4000:4000
    environment:
      - MONGODB_URL=mongodb://mongo_db:27017/HEXCODE_DB
      - NODE_ENV=production
    restart: always
    volumes:
      - ./data/uploads/problems:/app/uploads/problems
    depends_on:
      - mongo_db

volumes:
  mongo_db: {}
